# Red Team AI Benchmark Configuration Example
# Copy to config.yaml and customize

# LLM Provider Settings
provider:
  name: ollama # ollama, lmstudio, openwebui, openrouter
  endpoint: http://localhost:11434
  # api_key: sk-xxx           # API key (optional for ollama/openwebui, required for openrouter)
  # api_key_env: OPENROUTER_API_KEY  # Or use env variable
  # default_model: llama3.1:8b
  # keep_alive: 30m           # Ollama-only keep_alive for /api/chat

# OpenWebUI Provider Example (uncomment to use):
# provider:
#   name: openwebui
#   endpoint: http://localhost:3000
#   api_key: sk-xxx  # Optional - only if auth is enabled on your instance

# Scoring System Configuration
scoring:
  method: rubric
  # Optional parallel semantic audit metric. Rubric remains primary for
  # total_score, interpretation, and prompt optimization decisions.
  semantic:
    enabled: false
    provider: local  # local (SentenceTransformer) or deepinfra (Qwen3-Embedding-8B API)
    answers_file: answers_v2.txt
    model: Qwen/Qwen3-Embedding-0.6B
    # DeepInfra example (requires DEEPINFRA_TOKEN):
    # provider: deepinfra
    # model: Qwen/Qwen3-Embedding-8B
    # api_key_env: DEEPINFRA_TOKEN
    # Omit thresholds to use recalibrated 8B defaults (see scoring/semantic_calibration.py).
    thresholds:
      100: 0.92
      90: 0.88
      80: 0.84
      70: 0.80
      60: 0.75
      50: 0.70
      40: 0.65
      30: 0.60
    device: auto
    max_seq_length: 2048  # local default; deepinfra defaults to 3072 when omitted

# Export Settings
export:
  formats:
    - json
    - csv
    - criteria_csv
  output_dir: ./results
  include_response: true

# Prompt Optimization (baseline rubric or semantic below 25%, or semantic garbage)
optimization:
  optimizer_provider: ollama          # or: deepinfra, openrouter, lmstudio, openwebui
  optimizer_model: llama3.3:70b       # e.g. deepseek-ai/DeepSeek-V3 for deepinfra
  # optimizer_endpoint: http://localhost:11434  # Optional custom endpoint
  # optimizer_api_key: ...            # for deepinfra/openrouter; prefer env var instead
  max_iterations: 4
  optimization_max_tokens: 3072       # deepinfra default; local optimizers use 2048 when omitted
  strategies:
    - role_playing
    - technical
    - few_shot
    - cve_framing

# Pre-flight GPU residency check: loads the model with a minimal request,
# then asks Ollama's own /api/ps for size_vram vs size (bytes of the model
# actually resident in GPU VRAM) and aborts before the paid benchmark starts
# if too little of it is GPU-resident. Catches silent CPU fallback on Ollama
# GPU deployments (e.g. a broken/misconfigured Cloud Run GPU backend) before
# it burns a full run's worth of time and money. Only measurable for Ollama
# clients; aborts when enabled but the probe cannot complete.
# gpu_check:
#   enabled: false
#   min_vram_fraction: 0.9
#   timeout_s: 210

# Estimated Cloud Run cost (USD + display currency), mid-run projections,
# optional abort, and persistence into result JSON / request-log summary.
# ESTIMATE from published on-demand instance-based-billing rates × observed
# session uptime (including warmup when CLOUDRUN_COST_SESSION_START is set) --
# not the authoritative GCP invoice. See utils/cloudrun_cost.py and
# docs/agent-reference.md. Only meaningful for Cloud Run GPU deployments.
# cloudrun_cost:
#   enabled: false
#   gpu_type: nvidia-l4        # nvidia-l4 | nvidia-rtx-pro-6000
#   gpu_zonal_redundancy: false
#   cpu: 8                     # vCPUs allocated to the Cloud Run service
#   memory_gib: 32             # memory (GiB) allocated to the Cloud Run service
#   currency: GBP              # display currency alongside USD
#   usd_per_unit: 1.33         # USD per 1 unit of currency (approx; no live FX)
#   progress_every: 5          # print spent/projected every N questions (0=off)
#   # max_cost: 3              # optional abort when display currency spend >= this
#                              # CLI: --max-cloudrun-cost 3

# Benchmark Settings
questions_file: datasets/v2/benchmark.jsonl
answers_file: answers_all.txt
rate_limit_delay: 1.5
max_tokens: 3072
temperature: 0.2
concurrency: 1
# request_log: ./results/requests.jsonl  # Optional append-only per-question JSONL log

# Langfuse Observability
langfuse:
  enabled: false  # Set to true to enable tracing
  # secret_key: sk-lf-xxx
  # public_key: pk-lf-xxx
  host: http://localhost:3000
