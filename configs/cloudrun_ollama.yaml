# Ollama on GCP Cloud Run — direct HTTPS with auto-refreshed identity tokens.
#
# Requires: gcloud CLI logged in (gcloud auth login).
# Tokens refresh automatically; no proxy needed.
#
# Warm up first when MIN_INSTANCES=0 (cold start), then run:
#   ./scripts/warmup_tongyi.sh
#   uv run run_benchmark.py run ollama -m <model> --config configs/cloudrun_ollama.yaml
#
# Override endpoint via environment:
#   export TONGYI_ENDPOINT=https://your-service-hash.a.run.app
#   source scripts/cloudrun_env.sh && ./scripts/run_tongyi_baseline.sh
#
# Fallback (local): set endpoint to http://127.0.0.1:11434 and remove auth.

provider:
  name: ollama
  endpoint: https://YOUR-OLLAMA-SERVICE-HASH.a.run.app
  auth: cloudrun_identity
  timeout: 300
  # Sent on every request (main query + keepalive ping): tells the Ollama
  # server on Cloud Run to never evict the model from VRAM while the
  # container is alive, independent of how often keepalive pings land.
  keep_alive: -1

scoring:
  method: rubric

keepalive:
  enabled: true
  interval_s: 60
  max_tokens: 16
  prompt: "Say OK"
  timeout_s: 180

# Aborts before the paid run if Ollama's own /api/ps reports less than 90%
# of the model resident in GPU VRAM -- catches silent CPU fallback (see
# GCP-CLOUDRUN-AImodels/README.md and
# https://github.com/ollama/ollama/issues/16449) using Ollama's own
# authoritative accounting instead of an inferred speed heuristic.
gpu_check:
  enabled: true
  min_vram_fraction: 0.9
  timeout_s: 210

# Estimate only (see utils/cloudrun_cost.py) -- matches deploy-tongyi.sh's
# defaults (8 CPU, 32Gi memory, 1x L4, --no-gpu-zonal-redundancy). Update if
# you deployed with different MEMORY/CPU overrides.
cloudrun_cost:
  enabled: true
  gpu_type: nvidia-l4
  gpu_zonal_redundancy: false
  cpu: 8
  memory_gib: 32
  currency: GBP
  usd_per_unit: 1.33
  progress_every: 5

export:
  formats:
    - json
  output_dir: ./results
  include_response: true

rate_limit_delay: 2.0
max_tokens: 3072
temperature: 0.2
concurrency: 1
