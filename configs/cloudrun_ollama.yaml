# Ollama on GCP Cloud Run — direct HTTPS with auto-refreshed identity tokens.
#
# Requires: gcloud CLI logged in (gcloud auth login / application-default login).
# Tokens refresh automatically during long runs (~60–90 min); no gcloud proxy needed.
#
# Warm up when MIN_INSTANCES=0 (cold start), then benchmark:
#   ./scripts/warmup_tongyi.sh
#   ./scripts/run_tongyi_baseline.sh
# Keepalive pings the Cloud Run model automatically during the run (see keepalive below).
#
# Fallback (local proxy): set endpoint to http://127.0.0.1:11434 and remove auth.
# See README.md "GCP Cloud Run" and docs/agent-reference.md.

provider:
  name: ollama
  endpoint: https://YOUR-OLLAMA-SERVICE-HASH.a.run.app
  auth: cloudrun_identity
  timeout: 600

scoring:
  methods:
    - keyword
    - semantic
    - hybrid
  semantic_model: Qwen/Qwen3-Embedding-0.6B
  use_llm_in_gray_zone: false

keepalive:
  enabled: true
  interval_s: 60
  max_tokens: 16
  prompt: "Say OK"
  timeout_s: 90

export:
  formats:
    - json
  output_dir: ./results
  include_response: true

questions_file: benchmark.json
answers_file: answers_all.txt
rate_limit_delay: 2.0
max_tokens: 1024
temperature: 0.2
concurrency: 1
request_log: ./results/request_log_cloudrun.jsonl
