# BugTrace Apex G4 26B Q4 on GCP Cloud Run (Ollama) — direct HTTPS with identity tokens.
#
# Requires: gcloud CLI logged in (gcloud auth login).
# Tokens refresh automatically; no proxy needed.
#
# Warm up first when MIN_INSTANCES=0 (cold start may take 2-3 min), then run:
#   ./scripts/warmup_bugtrace.sh
#   ./scripts/run_bugtrace_baseline.sh
#
# Override endpoint via environment:
#   export BUGTRACE_ENDPOINT=https://your-service-hash.a.run.app
#   source scripts/cloudrun_env.sh

provider:
  name: ollama
  endpoint: https://YOUR-BUGTRACE-SERVICE-HASH.a.run.app
  auth: cloudrun_identity
  timeout: 600

scoring:
  method: rubric

keepalive:
  enabled: true
  interval_s: 60
  max_tokens: 16
  prompt: "Say OK"
  timeout_s: 180

export:
  formats:
    - json
  output_dir: ./results
  include_response: true

rate_limit_delay: 2.0
max_tokens: 4096
temperature: 0.2
concurrency: 1
