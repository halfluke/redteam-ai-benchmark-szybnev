# BugTrace Apex G4 26B Q4 on GCP Cloud Run (Ollama) — direct HTTPS with identity tokens.
#
# Requires: gcloud CLI logged in (gcloud auth login).
# Tokens refresh automatically; no proxy needed.
#
# Cold start may take 2-3 min when min-instances=0. Prefer the wrapper (it warms
# up automatically and tracks Cloud Run cost session start):
#   ./scripts/run_bugtrace_baseline.sh
#
# Or warm alone, then run without a second warmup:
#   ./scripts/warmup_bugtrace.sh
#   SKIP_PREFLIGHT=1 ./scripts/run_bugtrace_baseline.sh
#
# Endpoints: scripts/local_env.sh (auto-sourced when present) or export
# BUGTRACE_ENDPOINT / BUGTRACE_MODEL before running.

provider:
  name: ollama
  endpoint: https://YOUR-BUGTRACE-SERVICE-HASH.a.run.app
  auth: cloudrun_identity
  timeout: 300
  # Sent on every request (main query + keepalive ping): tells the Ollama
  # server on Cloud Run to never evict the model from VRAM while the
  # container is alive, independent of how often keepalive pings land.
  keep_alive: -1

scoring:
  method: rubric
  # Optional parallel semantic audit (--semantic --semantic-provider deepinfra)
  # semantic:
  #   provider: deepinfra
  #   model: Qwen/Qwen3-Embedding-8B

keepalive:
  enabled: true
  interval_s: 60
  max_tokens: 16
  prompt: "Say OK"
  timeout_s: 180

# Aborts before the paid run if Ollama's own /api/ps reports less than 90%
# of the model resident in GPU VRAM -- catches silent CPU fallback (see
# GCP-CLOUDRUN-AImodels/README.md and
# https://github.com/ollama/ollama/issues/16449) using Ollama's own
# authoritative accounting instead of an inferred speed heuristic.
gpu_check:
  enabled: true
  min_vram_fraction: 0.9
  timeout_s: 210

# Estimate only (see utils/cloudrun_cost.py) -- matches deploy-bugtrace.sh's
# defaults (8 CPU, 32Gi memory, 1x L4, --no-gpu-zonal-redundancy). Update if
# you deployed with different MEMORY/CPU overrides.
cloudrun_cost:
  enabled: true
  gpu_type: nvidia-l4
  gpu_zonal_redundancy: false
  cpu: 8
  memory_gib: 32
  currency: GBP
  usd_per_unit: 1.33
  progress_every: 5

export:
  formats:
    - json
  output_dir: ./results
  include_response: true

rate_limit_delay: 2.0
max_tokens: 3072
temperature: 0.2
concurrency: 1
